[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-pipelines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ac2>=0.3.58", "httpx>=0.28", "openai>=2.36", "pydantic>=2.13", "zstandard>=0.23"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipelines"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
