[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-email-opsd"
version = "0.1.0"
description = "Teach a sales email assistant a style policy with teacher-only OPSD hints."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["ac2>=0.3.73", "pytest>=8", "ruff>=0.11"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/sales_email_opsd"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
