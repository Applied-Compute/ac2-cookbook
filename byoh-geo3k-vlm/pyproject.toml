[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byoh-geo3k-vlm"
version = "0.1.0"
description = "Train a VLM on Geometry3K through a custom BYOH harness."
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0",
    "httpx>=0.28.1",
    "math-verify>=0.8.0",
    "openai>=1.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["ac2>=0.3.46", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/byoh_geo3k_vlm"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
