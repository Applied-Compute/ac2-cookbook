[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dapo-math-check"
version = "0.1.0"
description = "AC2 math environment with a bounded check_answer tool."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["ac2>=0.3.21"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/dapo_math_check"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
