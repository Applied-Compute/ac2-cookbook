[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lichess-puzzles"
version = "0.1.0"
description = "Deterministic multi-turn RL environment over public Lichess chess puzzles."
requires-python = ">=3.12"
dependencies = [
    "ac2>=0.3.24",
    "python-chess>=1.999",
    "zstandard>=0.23.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/lichess_puzzles"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]

[tool.ruff]
line-length = 100
target-version = "py312"
