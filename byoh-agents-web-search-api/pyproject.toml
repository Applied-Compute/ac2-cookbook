[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byoh-agents-web-search-api"
version = "0.1.0"
description = "Self-hosted AC2 harness using the OpenAI Agents SDK and web search."
requires-python = ">=3.12"
dependencies = [
    "ac2>=0.3.30",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
harness = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai-agents>=0.3.0",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/byoh_agents_web_search_api"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
