[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-acp-custom-harness"
version = "0.1.0"
description = "AC2 custom-harness starter using Harbor and an ACP agent."
requires-python = ">=3.12"
dependencies = [
    "harbor[modal]==0.20.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = ["ac2"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_acp"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
