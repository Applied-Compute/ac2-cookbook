[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo3k-vlm"
version = "0.1.0"
description = "Train a vision-language model on Geometry3K through a self-hosted harness."
requires-python = ">=3.12"
dependencies = [
    "ac2>=0.3.97",
]

[project.optional-dependencies]
harness = [
    "datasets>=4.0.0",
    "fastapi>=0.115.0",
    "math-verify>=0.8.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/geo3k_vlm"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
