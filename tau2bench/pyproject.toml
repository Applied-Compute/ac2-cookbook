[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau2bench"
version = "0.1.0"
description = "Self-hosted AC2 harness for the tau2-bench customer-service benchmark."
requires-python = ">=3.12"
dependencies = [
    "ac2>=0.3.97",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
harness = [
    "fastapi>=0.115.0",
    "openai>=1.99.0",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/tau2bench"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.ac2]
